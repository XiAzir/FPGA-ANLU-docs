main:
  push:
    - imports:
        - https://cnb.cool/XiAzir/FPGA-secrets/-/blob/main/github.yml
      stages:
        - name: sync-to-github
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/XiAzir/FPGA-ANLU-docs.git
            auth_type: https
            username: ${GIT_USERNAME}
            password: ${GIT_ACCESS_TOKEN}
            push_tags: true